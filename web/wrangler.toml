# grooveline.org/headliner/ (Zé, 19 Nov 2026: published, linked from the site later).
# Build: node tools/build.ts (web/dist, media hard-linked from ../App). Deploy: Zé runs
# `npm run deploy` in web/ (production deploys are his). The radio site's Pages project, DNS and
# API are untouched: this Worker only answers grooveline.org/headliner*. Grooveline Booth (the DJ software) has its own repo, Worker and
# route (grooveline.org/booth*, repo nexlineai/grooveline-booth, since 22 Nov 2026); the old LIVE links here redirect to it (tools/worker.js).
name = "grooveline-headliner"
main = "tools/worker.js"
compatibility_date = "2026-08-27"
workers_dev = false
preview_urls = false

[build]
command = "node tools/build.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
run_worker_first = true

[[routes]]
pattern = "grooveline.org/headliner*"
zone_name = "grooveline.org"

# The paywall (23 Nov 2026, tools/paywall/, vault headliner-other-platforms.md item 8). DARK until
# Zé flips PAYWALL to "on": "off" serves every file exactly as before and the game shows no lock.
# A browser can try it first with /headliner/api/preview?on=1 (a cookie, only for that browser).
# Setup (once, by Zé): tools/paywall-setup.sh creates headliner-db, applies migrations/ and asks for
# the three secrets (SESSION_SECRET, RESEND_API_KEY, PADDLE_WEBHOOK_SECRET); it then uncomments the
# [[d1_databases]] block below with the real id.
[vars]
PAYWALL = "off"
PADDLE_ENV = "sandbox"        # "live" with the live token and price
PADDLE_CLIENT_TOKEN = "test_1a555d0bf1d229ac062a7a63da8"   # SANDBOX client-side token (Paddle > My account > Settings > Authentication; public by design). Live: a live_ token
PADDLE_PRICE_ID = "pri_01m83v09yyj67txw3c8j1z6s17"        # SANDBOX price of "Grooveline Headliner: full career" (EUR 4.99 base, see the vault). Live: its own pri_

[[d1_databases]]
binding = "DB"
database_name = "headliner-db"
database_id = "022a8992-44bf-4590-ab79-7860ea6eb3c6"
migrations_dir = "migrations"
