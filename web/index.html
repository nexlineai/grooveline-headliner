<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070910">
  <title>Grooveline Headliner</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div id="room"></div>
  <canvas id="booth"></canvas>

  <div id="top">
    <button id="phones-button" class="pill"><svg class="icon" viewBox="0 0 24 24" width="1.2em" height="1.2em" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/><rect x="2.5" y="13.5" width="5" height="8" rx="2" fill="currentColor"/><rect x="16.5" y="13.5" width="5" height="8" rx="2" fill="currentColor"/></svg>PHONES</button>
    <button id="crate-button" class="pill">CRATE</button>
  </div>
  <div id="note"></div>

  <div id="crate" class="sheet" hidden>
    <div class="head"><h2>CRATE</h2><button id="crate-close" class="pill">CLOSE</button></div>
    <div id="crate-list"></div>
  </div>

  <div id="phones" class="sheet small" hidden>
    <div class="head"><h2>PHONES</h2><button id="phones-close" class="pill">CLOSE</button></div>
    <p>One stereo output and a splitter cable: the room in the left ear, the next record in the right.</p>
    <div class="modes">
      <button data-mode="off" class="pill on">OFF</button>
      <button data-mode="split" class="pill">SPLIT L/R</button>
    </div>
  </div>

  <div id="start">
    <div class="logo"><span class="bars"><i></i><i></i><i></i><i></i></span>GROOVELINE</div>
    <h1>HEADLINER</h1>
    <p>Web preview · tap to start the decks</p>
  </div>

  <script type="module" src="src/main.ts"></script>
</body>
</html>
