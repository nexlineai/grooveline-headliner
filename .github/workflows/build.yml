# Every push to main: package tests, an unsigned device IPA (artifact, 7 days) that iloader can
# sign, and screenshots from the iOS Simulator pushed to the `shots` branch.
# No secrets anywhere in this workflow. Never use pull_request_target.
name: build

on:
  push:
    branches: [main]
    # The web version has its own workflow (web.yml, Linux): a push that only touches web/ (or only
    # notes like CLAUDE.md) must not start a Mac build, nor cancel one that is running.
    paths-ignore: ['web/**', '.github/workflows/web.yml', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

# macOS runners are scarce (run 5 was dropped after waiting 15 minutes for one): a newer push
# replaces a run that is still waiting or building.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, so a push needs one Mac, not two (runs 5 and 7 lost a job waiting for a second one).
  # It may write, but only the last step does, and only to the `shots` branch: pictures of each
  # screen, so the game can be looked at from a machine that cannot run it.
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Package tests
        run: scripts/ci-test.sh
      - name: Unsigned device build
        run: scripts/ci-build-unsigned.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      # Uploaded before the screenshots are taken, so the build can be installed without waiting for them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: grooveline-headliner-unsigned-ipa
          path: build/GroovelineHeadliner-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Simulator screenshots
        run: scripts/ci-shots.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - name: Push the pictures to the shots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/shots
          echo "run ${{ github.run_number }}, commit ${{ github.sha }}" > README.txt
          git init -q -b shots
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "shots: run ${{ github.run_number }} (${{ github.sha }})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" shots
      # Raw logs need a token; annotations don't. On failure, surface the last log lines.
      - name: Log tails
        if: failure()
        run: |
          for f in build/*.log; do
            [ -f "$f" ] || continue
            tail -n 4 "$f" | sed -e 's/%/%25/g' -e "s#^#::error title=$(basename "$f")::#"
          done
