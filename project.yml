# XcodeGen spec. The .xcodeproj is generated (`xcodegen generate`) and never committed,
# so nobody hand-edits project files on Linux.
name: GroovelineHeadliner
options:
  bundleIdPrefix: org.grooveline
  deploymentTarget:
    iOS: "17.0"
packages:
  HeadlinerKit:
    path: Packages/HeadlinerKit
settings:
  base:
    # Must equal the App Store version string typed on the version page in App Store Connect.
    # 1.0 went live 20 Nov 2026; 1.1.0 carries build 6's cleanup plus iOS 17+, CUE preview,
    # beat-reactive room lighting, paywall polish, studio pattern save, and App Store review prompt.
    # testflight.yml refuses a tag that does not match this value.
    MARKETING_VERSION: "1.1.0"
    # CI overrides this with the workflow run number; every upload needs a higher one.
    # Nothing here is the App Store build number: that is BUILD_NUMBER = github.run_number.
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 mode: the audio thread shares plain memory with the game on purpose.
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  GroovelineHeadliner:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: HeadlinerKit
        product: HeadlinerCore
      - package: HeadlinerKit
        product: HeadlinerAudio
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Headliner
        # Explicit, so the build settings (and CI's run-number override) reach the plist.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Orbitron is the display face of grooveline.org (SIL Open Font License, text beside the fonts).
        UIAppFonts: [Orbitron-Bold.ttf, Orbitron-Black.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        # Let the booth run at 120 Hz on ProMotion phones.
        CADisableMinimumFrameDurationOnPhone: true
        # No network code at all, so the export questionnaire is skipped on every upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # iPhone only. Must be HERE: XcodeGen's iOS preset sets "1,2" on the target and beats the
        # project-wide value above (v0.1.0-4 shipped with iPad and App Store Connect asked for
        # 13-inch iPad screenshots).
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: org.grooveline.headliner
        PRODUCT_NAME: GroovelineHeadliner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
